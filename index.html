<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Data Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    
    <div class="container my-5">
        <h1 class="text-center mb-4">Excel Data Viewer</h1>
        <div class="card shadow-sm p-4">
            <div class="mb-3">
                <label for="excelFile" class="form-label"><strong>Upload an Excel File</strong></label>
                <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls">
            </div>
            <div id="sheetSelectorContainer" class="mb-3" style="display: none;">
                <label for="sheetSelector" class="form-label"><strong>Select a Sheet</strong></label>
                <select id="sheetSelector" class="form-select"></select>
            </div>
            <div class="alert alert-info" id="message" style="display: none;"></div>
            <div class="mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search data...">
            </div>
            <div id="tableContainer" style="overflow-x: auto;">
                <table id="dataTable" class="table table-bordered table-striped mt-3">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="downloadJSON" class="btn btn-primary" style="display: none;">Download JSON</button>
                <div id="paginationControls"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
